.toasts{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
[dir=rtl] .toasts{transform:translateX(50%)}
.toast{background:var(--deep);color:var(--cream);border-radius:999px;padding:10px 20px 10px 12px;display:flex;align-items:center;gap:10px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);animation:pop .2s}
[dir=rtl] .toast{padding:10px 12px 10px 20px}
.toast .ic{color:var(--green)}
.empty{text-align:center;padding:30px 20px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty .ava{width:150px;height:150px;border-radius:50%;background:var(--mint);overflow:hidden;display:flex;justify-content:center;align-items:flex-end;margin-bottom:8px}
.empty .ava img{width:120px}
.empty h3{margin:0;font-size:18px}
.empty p{margin:0 0 10px;color:var(--ink2);max-width:380px}
.sk{background:var(--sk);border-radius:14px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:sh 1.4s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.errc{display:flex;gap:16px;align-items:center;padding:22px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);border-inline-start:6px solid var(--danger)}
.errc .ai{width:52px;height:52px;border-radius:50%;background:#F8DEDA;color:var(--danger);display:grid;place-items:center;flex:none}
.proto{position:fixed;bottom:18px;inset-inline-end:18px;z-index:40;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:5px;padding-inline-start:14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);font-size:12px;font-weight:700;color:var(--ink2)}
.proto .seg button{min-height:30px;padding:0 10px;font-size:12px}
.sw{width:46px;height:28px;border-radius:999px;background:var(--grey);border:0;position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.sw.on{background:var(--teal)}
.sw.on::after{inset-inline-start:21px}
.rowx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.rowx:last-child{border-bottom:0}
.rowx .grow{flex:1;min-width:0}
.rowx .grow b{display:block}
.rowx .grow span{font-size:12px;color:var(--ink2)}
.disc{width:40px;height:40px;border-radius:50%;background:var(--mint);color:var(--deep);display:grid;place-items:center;flex:none}
.disc.dk{background:var(--deep);color:var(--mint)}
input[type=range]{width:100%;accent-color:var(--teal);height:28px}
.drop{border:2px dashed var(--teal);border-radius:22px;padding:30px;text-align:center;background:color-mix(in srgb,var(--teal) 6%,transparent);cursor:pointer}
.drop .disc{margin:0 auto 10px;width:56px;height:56px}
.player{background:#062B2B;border-radius:22px;height:220px;display:flex;justify-content:center;align-items:flex-end;position:relative;overflow:hidden}
.player img{height:210px}
.trim{position:relative;height:40px;background:var(--chip);border-radius:12px;margin-top:10px;overflow:hidden}
.trim .sel{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--teal) 35%,transparent);border-inline:4px solid var(--teal)}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps div{flex:1;height:6px;border-radius:6px;background:var(--chip)}
.steps div.on{background:var(--teal)}
.pipe{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pipe .st{flex:1;min-width:150px;border-radius:22px;padding:14px;background:var(--chip)}
.pipe .st.on{background:var(--deep);color:var(--cream)}
.pipe .st b{display:block;font-size:15px}
.pipe .st span{font-size:12px;opacity:.8}
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:start}
.ck{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--rule);background:var(--field);display:inline-grid;place-items:center;cursor:pointer;color:transparent}
.ck.on{background:var(--teal);border-color:var(--teal);color:#fff}
.ck .ic{width:16px;height:16px}
.heat{display:grid;grid-template-columns:44px repeat(24,1fr);gap:3px;font-size:10px;color:var(--ink2)}
.heat i{aspect-ratio:1;border-radius:4px;display:block}
.login{min-height:100vh;background:var(--teal);display:grid;grid-template-columns:1fr 1fr}
.login .l1{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;gap:16px}
.login .l2{background:var(--deep);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;overflow:hidden;color:var(--cream)}
.login .box{width:min(400px,100%)}
.login .inp{background:var(--cream);border:0;min-height:52px;color:var(--deep)}
.login .btn.dark{width:100%;min-height:52px;background:var(--deep);color:var(--cream)}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center}
.otp input{width:48px;height:56px;border-radius:14px;border:0;background:var(--cream);text-align:center;font-size:22px;font-weight:800;color:var(--deep)}
.mwatch{width:64px;height:64px;background:#111;border-radius:16px;padding:6px;flex:none}
.mwatch div{width:100%;height:100%;background:#062B2B;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mwatch .logo{width:26px;height:14px;color:var(--cream)}
.mwatch .bx{display:flex;gap:1px}.mwatch .bx i{width:5px;height:6px;border:1px solid #2CE3E0;border-radius:2px}
.iconsheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.iconsheet .it{border-radius:22px;padding:16px 10px;text-align:center;font-size:12px;font-weight:600}
.iconsheet .it.d{background:var(--deep);color:var(--cream)}
.iconsheet .it.c{background:var(--cream);color:var(--deep);border:1px solid var(--line)}
.iconsheet .ic{width:48px;height:48px;display:block;margin:0 auto 8px}
.tree{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tree .card a{display:block;color:var(--ink);text-decoration:none;padding:4px 0;font-size:13px}
.tree .card a:hover{color:var(--tealtext)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13.5px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:600}
.note{background:var(--mint);color:var(--deep);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
[data-theme=dark] .note{background:#13514C;color:var(--mint)}
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:center;padding:10px}
.cloud span{font-weight:800;line-height:1.2}

function xs(n,W,pad=0){return i=>{const x=pad+(W-2*pad)*(n<2?0.5:i/(n-1));return RTL()?W-x:x}}
function spark(v,col=C.teal){const W=110,H=34,mx=Math.max(...v),mn=Math.min(...v),X=xs(v.length,W,2),Y=y=>H-3-(H-6)*((y-mn)/((mx-mn)||1));
const d=v.map((y,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(y).toFixed(1)).join('');
return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:110px;height:34px" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(v.length-1)}" cy="${Y(v[v.length-1])}" r="3" fill="${col}"/></svg>`}
function grid(W,H,pb,max,ticks=4,fmt=v=>v){let s='';for(let i=0;i<=ticks;i++){const y=(H-pb)-(H-pb-10)*i/ticks;s+=`<line x1="${RTL()?0:34}" x2="${RTL()?W-34:W}" y1="${y}" y2="${y}" stroke="var(--rule)"/><text x="${RTL()?W:0}" y="${y+4}" text-anchor="${RTL()?'end':'start'}" style="direction:ltr">${fmt(Math.round(max*i/ticks))}</text>`}return s}
function area(series,labels,cols,H=230,{stack=true,fill=true}={}){const W=640,pb=24,n=labels.length;const X=xs(n,W-34,8),off=RTL()?0:34;
const tot=labels.map((_,i)=>stack?series.reduce((a,s)=>a+s[i],0):Math.max(...series.map(s=>s[i])));const max=Math.ceil(Math.max(...tot)*1.12/10)*10;const Y=v=>(H-pb)-(H-pb-10)*v/max;
let base=labels.map(()=>0),out='';series.forEach((s,k)=>{const top=s.map((v,i)=>stack?base[i]+v:v);
const pts=top.map((v,i)=>[off+X(i),Y(v)]);const bot=(stack?base:labels.map(()=>0)).map((v,i)=>[off+X(i),Y(v)]).reverse();
if(fill)out+=`<path d="M${pts.map(p=>p.join(' ')).join('L')}L${bot.map(p=>p.join(' ')).join('L')}Z" fill="${cols[k]}" opacity="${stack?.9:.12}"/>`;
out+=`<path d="M${pts.map(p=>p.join(' ')).join('L')}" fill="none" stroke="${cols[k]}" stroke-width="2.2"/>`;base=top});
const lab=labels.map((l,i)=>(i%Math.ceil(n/8)===0||i===n-1)?`<text x="${off+X(i)}" y="${H-6}" text-anchor="middle">${l}</text>`:'').join('');
return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${grid(W,H,pb,max)}${out}${lab}</svg>`}
function hbars(items,{max,col=C.teal,unit=''}={}){max=max||Math.max(...items.map(i=>i.v));return `<div style="display:flex;flex-direction:column;gap:9px">${items.map(i=>`<div style="display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:13px"><span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i.l}</span><div class="bar" style="height:12px"><i style="width:${(i.v/max*100).toFixed(1)}%;background:${i.c||col}"></i></div><span style="text-align:end;font-weight:700">${N(i.v)}${unit}</span></div>`).join('')}</div>`}
function vbars(vals,labels,{H=200,colf=()=>C.teal,thr=null}={}){const W=640,pb=24,n=vals.length,max=Math.max(...vals)*1.1,bw=(W-44)/n;let s=grid(W,H,pb,max);
vals.forEach((v,i)=>{const idx=RTL()?n-1-i:i;const x=(RTL()?0:34)+idx*bw+bw*.15,h=(H-pb-10)*v/max;s+=`<rect x="${x}" y="${H-pb-h}" width="${bw*.7}" height="${h}" rx="5" fill="${colf(i)}"/>`;if(labels[i]!=='')s+=`<text x="${x+bw*.35}" y="${H-6}" text-anchor="middle" style="direction:ltr">${labels[i]}</text>`});
if(thr!=null){const idx=RTL()?n-thr:thr;const x=(RTL()?0:34)+idx*bw;s+=`<line x1="${x}" x2="${x}" y1="6" y2="${H-pb}" stroke="${C.amber}" stroke-width="2" stroke-dasharray="5 4"/><text x="${x}" y="2" text-anchor="middle" style="fill:#B9781A;font-weight:700;direction:ltr">${THRESH.toFixed(2)}</text>`}

<script>
// ======================================================================
// BINA validated layer (Admin v5). Connects the approved Admin to the
// shared data layer (BinaRepo: Worker API v1, or local demo data when the
// file is opened directly). New screens reuse the existing components:
// ph(), B(), badge(), empty(), .card, .t, .tabs, .chips, .pipe, .player.

const BC=window.BinaCore,BR=window.BinaRepo,BP=window.BinaProviders;
const BX={ready:false,init:null,health:null,draft:{},tester:{},herr:{},mq:'',mf:{cat:'all',f1:'all',f2:'all',st:'all'},md:{q:'',type:'all',use:'all'},xm:null,focus:null,busy:false};
const bxActor=()=>ME.em;
function bxS(){return BX.ready&&BR?BR.state():null}
(function(){const BI=window.BinaIcons;if(!BI)return;['trash','archive','unlink','audio_file','video','table','columns','clock','copy','plus','check','pulse','plug','globe','sync','review','layers','file','sheet','tag','inbox','home','more','publish'].forEach(n=>{if(!AIC[n]&&BI.has(n))AIC[n]=BI.svg(n).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')})})();
function bxToast(m){toast(esc(m))}
function bxErr(e){if(!e)return L('حدث خطأ ولم يُحفظ شيء','Something went wrong and nothing was saved');if(typeof e==='string')return e;const f=e.details&&e.details.fields;if(Array.isArray(f)&&f.length&&typeof f[0]==='object')return f.map(x=>S.lang==='ar'?(x.message_ar||x.message):x.message).join(' · ');if(e.code==='CONFLICT'&&/changed since/.test(e.message||''))return L('تغيّر هذا العنصر منذ فتحته. أعد التحميل وحاول مرة أخرى.','This item changed since you opened it. Reload and try again.');return e.message||e.code||String(e)}
function bxDate(iso){if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return String(iso);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
function bxToday(){const d=new Date();try{return S.lang==='ar'?new Intl.DateTimeFormat('ar-SA-u-nu-arab',{weekday:'long',day:'numeric',month:'long',year:'numeric',calendar:'gregory'}).format(d)+' · '+new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab',{day:'numeric',month:'long',year:'numeric'}).format(d)+' · توقيت الرياض':new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)+' · Riyadh time'}catch(e){return d.toDateString()}}
function bxCount(k){const st=bxS();if(!st)return 0;if(k==='review')return BC.reviewQueue(st).length;if(k==='feedback')return (st.feedback||[]).filter(f=>f.status!=='resolved'&&f.status!=='dismissed').length;if(k==='unsupported')return (st.unsupported_requests||[]).filter(u=>u.status==='new'||u.status==='triaged').length;return 0}
function bxSample(){return `<span class="badge b-grey bx-nodot">${L('بيانات نموذجية','Sample data')}</span>`}
// ---------- status chips
const BXR={ready:['جاهز','Ready','b-green'],partial:['جزئي','Partial','b-amber'],blocked:['متوقف','Blocked','b-red'],disabled:['معطّل','Disabled','b-grey'],none:['غير مُعد','Not set up','b-grey']};
function bxStLabel(s){return L(...(BXR[s]||BXR.none).slice(0,2))}
function bxF2Demo(st,id){const p=BC.getFlow2(st,id),a=p&&BC.getAsset(st,p.avatar_asset_id);return !!(a&&a.demo_asset&&!a.production_approved)}
function bxReady(s,demo){if(s==='ready'&&demo)return `<span class="badge b-teal" data-ready="ready">${L('جاهز للعرض','Demo ready')}</span>`;const r=BXR[s]||BXR.none;return `<span class="badge ${r[2]}" data-ready="${s}">${L(r[0],r[1])}</span>`}
function bxLc(lc){const m={draft:['مسودة','Draft','b-grey'],active:['نشط','Active','b-green'],archived:['مؤرشف','Archived','b-grey']}[lc]||['—','—','b-grey'];return badge(m)}
const BXRV={pending:['بانتظار المراجعة','Pending review','b-amber'],approved:['معتمد','Approved','b-teal'],changes_requested:['مطلوب تعديل','Changes requested','b-amber'],rejected:['مرفوض','Rejected','b-red']};
const BXRT={cleared:['الحقوق مُجازة','Rights cleared','b-teal'],demo_only:['للعرض فقط','Demo only','b-grey'],pending:['الحقوق قيد المراجعة','Rights pending','b-amber'],restricted:['مقيّد','Restricted','b-red']};
function bxRv(v){return v&&BXRV[v]?badge(BXRV[v]):'<span class="hint">—</span>'}
function bxRt(v){return v&&BXRT[v]?badge(BXRT[v]):'<span class="hint">—</span>'}
function bxMedia(kind,state){const nm={ar:['عربي','AR'],en:['إنجليزي','EN'],av:['الأفاتار','Avatar']}[kind];const s={ready:['جاهز','ready','b-green'],review:['قيد المراجعة','in review','b-amber'],blocked:['متوقف','blocked','b-red'],missing:['مفقود','missing','b-red'],'n/a':['غير مُعد','not set up','b-grey']}[state]||['—','—','b-grey'];return `<span class="badge ${s[2]} bx-nodot" data-media="${kind}-${state}">${ic(kind==='av'?'play':'speaker')}${L(nm[0]+' '+s[0],nm[1]+' '+s[1])}</span>`}
function bxSignLang(s){if(/saudi/i.test(s||''))return L('لغة الإشارة السعودية (مرجع)','Saudi Sign Language (reference)');if(/malaysian|\bBIM\b/i.test(s||''))return L('لغة الإشارة الماليزية BIM (مرجع)','Malaysian Sign Language, BIM (reference)');return s||''}
function bxIsRef(a){return !!a&&(a.source==='TALKBIM_COLLAB_REFERENCE'||(a.flags||[]).includes('TALKBIM_COLLAB_REFERENCE'))}
function bxIsMockAudio(a){return !!a&&((a.flags||[]).includes('MOCK_AUDIO')||a.source==='MOCK_TTS_ESPEAK_NG')}
function bxNote(a){if(!a)return '';if(S.lang==='ar'){if(bxIsRef(a))return 'مقطع مرجعي من تعاون TalkBIM لاختبار التكامل فقط. ليس اعتمادًا للغة الإشارة السعودية وليس معتمدًا للإنتاج.';if(bxIsMockAudio(a))return 'صوت آلي تجريبي (espeak-ng) وليس تسجيلًا من بينا.'}return a.note||''}
function bxProv(a){if(!a)return '';const f=a.flags||[],out=[],n=esc(bxNote(a));
if(bxIsRef(a)){out.push(`<span class="badge b-teal bx-nodot" data-prov="reference" title="${n}">${L('تجريبي · مرجع خارجي (TalkBIM)','DEMO · EXTERNAL / COLLAB REFERENCE')}</span>`);if(a.sign_language)out.push(`<span class="badge b-grey bx-nodot" title="${n}">${esc(bxSignLang(a.sign_language))}</span>`)}
else if(bxIsMockAudio(a))out.push(`<span class="badge b-amber bx-nodot" data-prov="demo-audio" title="${n}">${L('صوت تجريبي','Demo audio')}</span>`);
else if(f.includes('NOT_A_REAL_SIGN')||a.source==='MOCK_PLACEHOLDER')out.push(`<span class="badge b-amber bx-nodot" title="${n}">${L('عنصر مؤقت، ليست إشارة حقيقية','Placeholder, not a real sign')}</span>`);
if(a.local_blob||a.source==='ADMIN_UPLOAD')out.push(`<span class="badge b-teal bx-nodot">${L('مرفوع من اللوحة','Uploaded here')}</span>`);
out.push(a.production_approved?`<span class="badge b-green">${L('معتمد للإنتاج','Production approved')}</span>`:`<span class="badge b-grey bx-nodot" data-prov="not-production">${L('ليس للإنتاج','NOT PRODUCTION')}</span>`);return out.join(' ')}
function bxAssetLine(a){if(!a)return '';const bits=[`<span class="id">${esc(a.asset_id)}</span>`,'v'+(a.version||1)];if(a.duration_ms)bits.push((a.duration_ms/1000).toFixed(1)+' s');if(a.width&&a.height)bits.push(a.width+'×'+a.height);return `<span class="hint ltr">${bits.join(' · ')}</span>`}
// ---------- players (one shared audio element outside #root, so re-renders never cut playback)
const BXA={id:null};
function bxAudioEl(){return document.getElementById('bx-audio')}
function bxPlayBtn(a,label){if(!a)return `<button class="btn cream sm" disabled>${ic('play')}${L('لا يوجد صوت','No audio')}</button>`;return `<button class="btn cream sm" data-act="bxPlay" data-a="${esc(a.asset_id)}" data-bx-play="${esc(a.asset_id)}" aria-pressed="false" aria-label="${esc(label)}">${ic('play')}<span>${L('تشغيل','Play')}</span></button>`}
function bxSyncPlay(){const el=bxAudioEl();if(!el)return;document.querySelectorAll('[data-bx-play]').forEach(b=>{const on=b.dataset.bxPlay===BXA.id&&!el.paused&&!el.ended;b.setAttribute('aria-pressed',on?'true':'false');b.classList.toggle('dark',on);b.classList.toggle('cream',!on);const ics=b.querySelector('svg');if(ics)ics.outerHTML=ic(on?'pause':'play');const s=b.querySelector('span');if(s)s.textContent=on?L('إيقاف','Pause'):L('تشغيل','Play')})}
function bxVideo(a,label){if(!a)return `<div class="player bx-stage"><div class="bx-novid">${ic('no_sign')}<span>${L('لا يوجد مقطع موثّق لهذا المعنى بعد','No verified clip for this meaning yet')}</span></div></div>`;return `<div class="player bx-stage"><video data-bx-video="${esc(a.asset_id)}" controls playsinline preload="metadata" aria-label="${esc(label)}"></video></div><p class="hint bx-vmsg" data-bx-vmsg="${esc(a.asset_id)}" role="status"></p>`}
function bxHydrate(){if(!bxS())return;document.querySelectorAll('video[data-bx-video]').forEach(v=>{if(v.dataset.bound)return;v.dataset.bound='1';const id=v.dataset.bxVideo,a=BC.getAsset(bxS(),id),msg=t=>{const m=document.querySelector(`[data-bx-vmsg="${id}"]`);if(m)m.textContent=t};v.addEventListener('error',()=>msg(v.error&&v.error.code===4?L('هذا المتصفح لا يستطيع تشغيل هذا الفيديو (H.264 MP4). يعمل في Chrome و Edge و Safari.','This browser cannot decode this video (H.264 MP4). It plays in Chrome, Edge and Safari.'):L('تعذر تحميل المقطع','Could not load the clip')));if(a)BR.mediaUrl(a).then(u=>{if(!v.getAttribute('src'))v.src=u},e=>msg(bxErr(e)))})}
function bxPlaying(){return [...document.querySelectorAll('#root video')].some(v=>!v.paused&&!v.ended)}
// ---------- integration status (truthful: MOCK / NOT CONFIGURED / UNREACHABLE / LIVE)
const BXST={live:['مباشر','LIVE','b-green','ok'],mock:['MOCK','MOCK','b-teal','warn'],not_configured:['غير مُعد','NOT CONFIGURED','b-grey','off'],configured:['مُعد، لم يُفحص','CONFIGURED','b-amber','warn'],unreachable:['تعذر الوصول','UNREACHABLE','b-red','bad']};
function bxStatusText(s){const x=BXST[s]||BXST.not_configured;return L(x[0],x[1])}
function bxStack(){const api=BR&&BR.mode&&BR.mode()==='api',sv=(BR&&BR.server&&BR.server())||{},st=sv.status||{};const one=(key,icon,name,status,note)=>({key,icon,name,status,note,cls:(BXST[status]||BXST.not_configured)[2],dot:(BXST[status]||BXST.not_configured)[3]});
